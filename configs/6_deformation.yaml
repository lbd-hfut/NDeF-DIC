# 6_deformation.yaml
# Purpose:
#   Configure neural-field deformation estimation on the dense reference
#   surface. The network maps 3D reference coordinates to 3D displacement.
#
# Current algorithm:
#   X_sfm -> MLP -> u_sfm, X_def = X_sfm + u_sfm.
#   Reference/current image photometric consistency is evaluated over visible
#   cameras using 5x5 patches by default. Final exported points/displacements
#   are multiplied by sfm2world scale when enabled in 1_project.yaml.

deformation:
  # Output directory, relative to project.result_dir.
  output_dir: deformation

  input:
    # Dense reference surface dataset generated by dense.surface_sampler.
    # Relative to project.result_dir.
    surface_dataset: dense/surface_sampler/deformation_surface_dataset.npz

    # SfM cameras used for projection.
    # Relative to project.result_dir.
    sfm_dir: sfm

    # Image folder relative to project.data_dir.
    image_dir: images

    # Reference/current image choice follows project.image_sequence.
    reference_selector: first
    current_selector: all_after_reference

  network:
    # Network architecture is 3 -> 32 -> 32 -> 32 -> 32 -> 32 -> 3.
    hidden_dim: 32
    hidden_layers: 5

    # Activation options:
    #   tanh: current choice, smooth and bounded hidden representation.
    activation: tanh

    # Positional encoding options:
    #   true: allows higher-frequency deformation but requires smoothness loss.
    #   false: smoother low-capacity MLP, current best setting for CylinderDIC.
    use_positional_encoding: false

    # Number of frequency bands if use_positional_encoding=true.
    positional_encoding_frequencies: 6

  displacement_scale:
    # Network output scale source.
    # Options:
    #   precalculation: load robust scale from patch-DIC pre-calculation.
    #   manual: use value below.
    #   none: use 1.0 in SfM units.
    source: precalculation

    # Relative to project.result_dir.
    path: deformation/precalculation/patch_dic_sparse/displacement_scale.json

    # Options depend on the pre-calculation output:
    #   mean, median, p75, p90, max.
    stat: mean

    # Used only when source=manual.
    value: null

  loss:
    # Photometric loss options:
    #   mse: direct gray residual MSE. Suitable when lighting is stable.
    #   znssd: local normalized subset loss. More robust to intensity changes.
    photometric: mse

    # Patch radius for photometric loss. radius=2 means 5x5 patch.
    patch_radius: 2

    # Required valid pixel ratio inside a patch.
    min_valid_patch_ratio: 1.0

    # Penalty added when projected patches become invalid.
    invalid_patch_penalty: 0.05

    # Smoothness loss weight.
    # Recommended:
    #   0.0 when use_positional_encoding=false.
    #   small positive value, e.g. 1e-5, when use_positional_encoding=true.
    lambda_smooth: 0.0

    # Numerical epsilon for ZNSSD.
    znssd_eps: 1.0e-6

  training:
    # Current best CylinderDIC setting after learning-rate sweep.
    epochs: 150
    lr: 0.003

    # Options:
    #   auto: choose batch from available CUDA memory fraction.
    #   integer: fixed batch size.
    batch_size: 51172

    # Used when batch_size=auto.
    memory_fraction: 0.80
    auto_batch_start: 1024
    auto_batch_max: null

    # Save best checkpoint by minimum training loss.
    save_best: true

    weight_decay: 0.0
    max_steps_per_epoch: null
    log_interval: 10
    seed: 23

    # Device options:
    #   auto: cuda if available else cpu.
    #   cuda: require/prefer GPU.
    #   cpu: force CPU.
    device: auto

  export:
    # Apply project.scale.sfm2world_scale_json to exported
    # points/displacements and 3D visualization.
    apply_sfm2world_scale: true

    # Keep SfM-scale arrays in NPZ for debugging and backward compatibility.
    keep_sfm_scale_arrays: true

    # Number of points sampled in the 3D visualization.
    max_visualization_points: 60000
