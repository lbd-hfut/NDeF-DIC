[project]
name = "ndef-dic"
version = "0.1.0"

description = "NDeF-DIC: Neural Deformation Field for Multi-Camera Digital Image Correlation — NeRF-based unified 3D representation for stitch-free multi-camera DIC measurement"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "Boda Li" },
]

requires-python = ">=3.10"

keywords = [
  "dic",
  "digital-image-correlation",
  "nerf",
  "neural-radiance-field",
  "multi-camera",
  "3d-reconstruction",
  "deformation-field",
  "sdf",
  "scientific-machine-learning",
  "computer-vision",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Natural Language :: English",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
  "Development Status :: 3 - Alpha",
]

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
dependencies = [
  # Core ML
  "torch>=2.0.0",
  "numpy>=1.24.0",
  # Image processing
  "opencv-python>=4.8.0",
  "imageio>=2.31.0",
  # Data & scientific
  "scipy>=1.10.0",
  "matplotlib>=3.7.0",
  # Utilities
  "tqdm>=4.65.0",
  "tensorboard>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/lbd-hfut/NDeF-DIC"
Repository = "https://github.com/lbd-hfut/NDeF-DIC"
Documentation = "https://github.com/lbd-hfut/NDeF-DIC"

[project.optional-dependencies]
# COLMAP integration (for reading .mat calibration files, running SfM)
colmap = [
  "scipy>=1.10.0",
]

# Development
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1.0",
  "mypy>=1.0",
  "black>=23.0",
]

# Visualization extras
viz = [
  "open3d>=0.17.0",
  "plotly>=5.14.0",
  "pyvista>=0.42.0",
]

# Full install: everything
all = [
  "ndef-dic[colmap,dev,viz]",
]

# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ndef_dic"]

[tool.hatch.build.targets.sdist]
include = [
  "ndef_dic",
  "run.py",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line-too-long (handled by formatter)
  "B008",  # do-not-perform-function-calls-in-argument-defaults
  "N806",  # non-lowercase-variable-in-function (OK for ML code with K, R, t, etc.)
  "N803",  # invalid-argument-name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ are intentional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/", "__pycache__/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
  "--durations=10",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "gpu: marks tests that require a GPU (deselect with '-m \"not gpu\"')",
]

[tool.coverage.run]
source = ["ndef_dic"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# Black (kept in sync with Ruff)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]
