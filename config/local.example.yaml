# Example local configuration. Copy to config/local.yaml and customize.
# config/local.yaml is loaded with higher priority than default.yaml.
# It is .gitignored — your local settings are not committed.

device: cpu

data:
  data_dir: case/CylinderDIC

step1:
  sparse_mode: skip_sfm    # "skip_sfm" if calibration already exists

step3:
  training:
    phases:
      # Reduce iterations for quick experiments:
      - patch_size: 32
        lambda_smooth: 0.01
        iterations: 500
        lr: 0.001
      - patch_size: 16
        lambda_smooth: 0.001
        iterations: 1000
        lr: 0.0005
