# =============================================================================
# NDeF-DIC GPU-optimized configuration
# Uses Frequency (PE) encoding — 32× faster than HashGrid on GPU
# =============================================================================

data:
  data_dir: case/CylinderDIC
  image_dir: images
  calib_dir: calibration
  image_width: 1440
  image_height: 1080
  ref_mode: first
  ref_name: "001"

device: cuda

output:
  clean: false

step1:
  sparse_mode: skip_sfm
  dense:
    path: none
    patchmatch:
      window_radius: 7
      window_step: 1
      num_iterations: 7
      num_samples: 15
      geom_consistency: true
      filter_min_ncc: 0.1
      filter_min_num_consistent: 2
      ncc_sigma: 0.6
      max_depth_error: 0.01
      max_normal_error: 10.0
      max_reproj_error: 2.0
    pinn_stereo:
      n_frequencies: 10
      hidden_dim: 256
      n_layers: 4
      stage1_epochs: 500
      stage1_lr: 0.001
      stage1_batch_size: 2048
      stage2_epochs_max: 5000
      stage2_lr: 0.0001
      stage2_patience: 50
      stage2_batch_size: 128
      patch_radius: 5
      znssd_eps: 1.0e-6
      roi_dilation: 15
  postprocess:
    subsample_target: 200000
    skip_sor: false
    sor_k: 20
    sor_std_ratio: 2.0
    normal_k: 30

step2:
  method: point_cloud

step3:
  # Key GPU optimization: PE is 32× faster than HashGrid (dense vs sparse hash lookup)
  spatial_encoding: frequency
  pe_n_freqs: 10

  hash_grid:
    n_levels: 16
    n_features_per_level: 2
    base_resolution: 16
    finest_resolution: 512
    hash_table_size: 524288

  temporal:
    strategy: binary
    n_freqs: 6

  deformation:
    hidden_dim: 256
    alpha: 5.0
    learnable_alpha: false

  training:
    batch_size: 1024         # 2048 causes OOM on 12GB GPUs
    cameras_per_point: 3
    load_step_strategy: joint
    grad_clip_norm: 1.0

    phases:
      - patch_size: 32
        lambda_smooth: 0.01
        iterations: 500
        lr: 0.001
        log_interval: 50
        validate_interval: 250

      - patch_size: 16
        lambda_smooth: 0.001
        iterations: 800
        lr: 0.0005
        log_interval: 50
        validate_interval: 400

      - patch_size: 8
        lambda_smooth: 0.0001
        iterations: 500
        lr: 0.0001
        log_interval: 50
        validate_interval: 250

    checkpoint_dir: checkpoints
    save_interval: 1000
