# =============================================================================
# NDF-DIC default configuration
# Copy to config/local.yaml and override as needed.
# =============================================================================

# ---- Data paths ----
data:
  data_dir: case/CylinderDIC
  image_dir: images
  calib_dir: calibration
  image_width: 1440
  image_height: 1080
  ref_mode: first       # "first" | "named"
  ref_name: "001"

# ---- Device ----
device: cuda             # "cuda" | "cpu"

# ---- Output ----
output:
  clean: false           # remove previous results before starting

# =============================================================================
# Step 1: Geometric Reconstruction
# =============================================================================

step1:
  sparse_mode: skip_sfm   # "full" | "skip_sfm"

  dense:
    path: patchmatch       # "patchmatch" | "pinn_stereo" | "none"

    # --- COLMAP PatchMatch Stereo ---
    patchmatch:
      window_radius: 7
      window_step: 1
      num_iterations: 7
      num_samples: 15
      geom_consistency: true
      filter_min_ncc: 0.1
      filter_min_num_consistent: 2
      ncc_sigma: 0.6
      max_depth_error: 0.01
      max_normal_error: 10.0
      max_reproj_error: 2.0

    # --- PINN-Stereo (neural depth) ---
    pinn_stereo:
      n_frequencies: 10
      hidden_dim: 256
      n_layers: 4
      stage1_epochs: 500
      stage1_lr: 0.001
      stage1_batch_size: 2048
      stage2_epochs_max: 5000
      stage2_lr: 0.0001
      stage2_patience: 50
      stage2_batch_size: 128
      patch_radius: 5
      znssd_eps: 1.0e-6
      roi_dilation: 15

  # --- Post-processing ---
  postprocess:
    subsample_target: 200000
    skip_sor: false
    sor_k: 20
    sor_std_ratio: 2.0
    normal_k: 30

# =============================================================================
# Step 2: Surface Representation
# =============================================================================

step2:
  method: point_cloud     # "point_cloud" | "neural_stereo"

# =============================================================================
# Step 3: Neural Deformation Field
# =============================================================================

step3:
  # Hash grid encoding
  hash_grid:
    n_levels: 16
    n_features_per_level: 2
    base_resolution: 16
    finest_resolution: 512
    hash_table_size: 524288    # 2^19

  # Temporal encoding
  temporal:
    strategy: binary           # "binary" | "pe" | "pe_smooth"
    n_freqs: 6

  # Deformation network
  deformation:
    hidden_dim: 256
    alpha: 5.0
    learnable_alpha: false

  # Training phases (coarse-to-fine)
  training:
    batch_size: 1024
    cameras_per_point: 3
    load_step_strategy: joint  # "joint" | "sequential" | "curriculum"
    grad_clip_norm: 1.0

    phases:
      - patch_size: 32
        lambda_smooth: 0.01
        iterations: 2000
        lr: 0.001
        log_interval: 100
        validate_interval: 500

      - patch_size: 16
        lambda_smooth: 0.001
        iterations: 5000
        lr: 0.0005
        log_interval: 100
        validate_interval: 500

      - patch_size: 8
        lambda_smooth: 0.0001
        iterations: 3000
        lr: 0.0001
        log_interval: 100
        validate_interval: 500

    # Checkpoint
    checkpoint_dir: checkpoints
    save_interval: 1000
